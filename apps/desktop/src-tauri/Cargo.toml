[package]
name = "nexus-desktop"
version = "0.10.0"
description = "NEXUS AI Game Development Bridge Desktop Shell"
authors = ["NEXUS Team"]
edition = "2021"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
