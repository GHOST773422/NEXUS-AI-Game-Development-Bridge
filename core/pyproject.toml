[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.10.0"
description = "NEXUS Python background daemon, gateway, security, and task orchestrator."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "websockets>=13.0",
  "pydantic>=2.9.0",
  "aiosqlite>=0.20.0",
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]
packaging = [
  "pyinstaller>=6.10.0",
]
